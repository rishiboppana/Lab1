version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: airbnb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: airbnb  # Changed from airbnb_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - airbnb-network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: airbnb-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - airbnb-network

  # Kafka with Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: airbnb-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - airbnb-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: airbnb-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - airbnb-network

  # Backend Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: airbnb-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - ORIGIN=http://localhost  # Changed from http://localhost:5173
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASS=1234
      - DB_NAME=airbnb
      - MONGODB_URI=mongodb://admin:adminpassword@mongodb:27017/sessiondb?authSource=admin
      - KAFKA_BROKERS=kafka:29092
      - SESSION_SECRET=devsecret
      - SESSION_NAME=sid
    depends_on:
      - mysql
      - mongodb
      - kafka
    networks:
      - airbnb-network

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: airbnb-ai-service
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
    networks:
      - airbnb-network

  # Frontend Service
  frontend:
    build:
      context: ./Frontend/my-react-app
      dockerfile: Dockerfile
    container_name: airbnb-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - airbnb-network

networks:
  airbnb-network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data: